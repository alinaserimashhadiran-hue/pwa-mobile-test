<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a73e8" />
  <meta name="description" content="نمونه آزمایشی PWA برای سامانه محتوای آموزشی" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <title>آزمایش PWA + Mobile Server</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
    }
    h1 { font-size: 1.3rem; margin-bottom: 6px; }
    h2 { font-size: 1.05rem; margin: 18px 0 10px; color: var(--accent); }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      font-size: 0.92rem;
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.ok { background: var(--success); }
    .dot.fail { background: var(--danger); }
    .dot.warn { background: var(--warning); }
    .dot.unknown { background: var(--muted); }
    input, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      margin-top: 8px;
    }
    button {
      background: var(--accent);
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    button.danger {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
    }
    .log {
      background: #020617;
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, monospace;
      font-size: 0.78rem;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      direction: ltr;
      text-align: left;
    }
    .hint { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
    audio { width: 100%; margin-top: 10px; }
    .hidden { display: none; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
  </style>
</head>
<body>
  <h1>آزمایش PWA + Mobile Server</h1>
  <p class="hint">نمونه امکان‌سنجی — بدون دامنه پولی و بدون APK</p>

  <div class="card">
    <h2>وضعیت قابلیت‌ها</h2>
    <div class="status"><span class="dot unknown" id="sw-dot"></span><span id="sw-text">Service Worker: …</span></div>
    <div class="status"><span class="dot unknown" id="online-dot"></span><span id="online-text">اتصال اینترنت: …</span></div>
    <div class="status"><span class="dot unknown" id="secure-dot"></span><span id="secure-text">Secure Context: …</span></div>
    <div class="status"><span class="dot unknown" id="lna-dot"></span><span id="lna-text">Local Network Access: …</span></div>
  </div>

  <div class="card">
    <h2>آدرس Mobile Server</h2>
    <input type="text" id="server-url" placeholder="مثلاً http://192.168.1.50:8080" value="" />
    <p class="hint">IP محلی دستگاهی که server.py روی آن اجرا شده را وارد کنید.</p>
    <button id="btn-test">تست اتصال</button>
    <button id="btn-download" class="secondary" disabled>دانلود و ذخیره در IndexedDB</button>
  </div>

  <div class="card">
    <h2>فایل ذخیره‌شده</h2>
    <div id="download-result" class="hint">در حال بررسی IndexedDB…</div>
    <audio id="player" controls class="hidden"></audio>
    <div class="row">
      <button id="btn-play-stored" class="secondary" disabled>پخش از حافظه</button>
      <button id="btn-delete" class="danger" disabled>حذف فایل</button>
    </div>
  </div>

  <div class="card">
    <h2>لاگ</h2>
    <div class="log" id="log"></div>
    <button id="btn-clear" class="secondary" style="margin-top:10px">پاک کردن لاگ</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
